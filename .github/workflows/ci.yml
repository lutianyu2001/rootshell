# The checks of an Xcode app: on a push to main, on a pull request, by hand (gh workflow run ci.yml
# --ref <branch>), and from release.yml before a release, run the unit tests on an iOS simulator and
# build the IPA (scripts/sideload/build-ipa.sh). By hand: the same xcodebuild test command, and the
# script.
name: CI

# A change to docs alone builds nothing, so it runs no checks.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Per project: an Xcode the project builds with. The runner image keeps several side by side
# (/Applications/Xcode_<version>.app); its default, the newest, may refuse code an older one takes.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unauthenticated, GitHub's API refuses (403) the Swift packages' binary downloads once the
      # runner's shared rate limit is used up; this run's read-only token lifts it.
      - name: Authenticate Swift package downloads
        env:
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'machine api.github.com login x-access-token password %s\n' "$TOKEN" > ~/.netrc

      - name: Show the Xcode version
        run: xcodebuild -version

      # The newest available iPhone simulator. Per project: the project and the scheme that runs
      # the unit tests.
      - name: Run the unit tests
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in devices if ".iOS-" in r), reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("no iPhone simulator")
          ')
          xcodebuild test -project rootshell.xcodeproj -scheme rootshellTests \
            -destination "id=$udid" -packageAuthorizationProvider netrc CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unauthenticated, GitHub's API refuses (403) the Swift packages' binary downloads once the
      # runner's shared rate limit is used up; this run's read-only token lifts it.
      - name: Authenticate Swift package downloads
        env:
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'machine api.github.com login x-access-token password %s\n' "$TOKEN" > ~/.netrc

      # Metal shaders need Xcode's Metal Toolchain, a separate download. Per project: delete this
      # step when the project has no .metal files.
      - name: Install the Metal Toolchain
        run: |
          xcodebuild -version
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # Without the release's whole-module optimization, which takes an hour for a large app: this
      # checks that the IPA builds and signs, release.yml builds the optimized one.
      - name: Build the IPA
        env:
          IPA_BUILD_SETTINGS: SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile
        run: scripts/sideload/build-ipa.sh "$RUNNER_TEMP/derived" "$RUNNER_TEMP/ci-ios.ipa"
