# The release of an Xcode app's IPA for SideStore: pushing a version tag runs ci.yml, then builds an
# IPA, signed ad hoc only, on macOS and creates the GitHub release with it. This file holds all of
# the project's releasing. By hand: scripts/sideload/build-ipa.sh, then gh release create with the
# IPA.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Per project: the same Xcode as ci.yml.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  # Whether the tag is a pre-release: one that ends in -alpha, -beta, -rc, -pre, -preview or -dev,
  # with or without a number after it (v1.2.0-rc.1, v1.2.0-rc1; in a sidestream fork
  # v0.8.2-mod.2-rc.1, while v0.8.2-mod.2 is a release). A pre-release is built as a release is and gets a GitHub pre-release with its files,
  # to download and try: it goes to no registry or package repository, and starts no other workflow.
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eq -- '-(alpha|beta|rc|pre|preview|dev)\.?[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The project's ci.yml, its tests and its IPA build: a release goes out only when they pass.
  # ./ rather than $/, which actionlint 1.7.12 does not know yet.
  ci: # zizmor: ignore[self-repository]
    uses: ./.github/workflows/ci.yml

  # Builds the IPA from the tag, with neither a secret nor a token that can write: building runs
  # the project's code and its dependencies'.
  build:
    needs: [kind, ci]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # The whole history, without old files' contents: build-ipa.sh counts the commits for the
      # IPA's build number.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      # Unauthenticated, GitHub's API refuses (403) the Swift packages' binary downloads once the
      # runner's shared rate limit is used up; this run's read-only token lifts it.
      - name: Authenticate Swift package downloads
        env:
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf 'machine api.github.com login x-access-token password %s\n' "$TOKEN" > ~/.netrc

      # Metal shaders need Xcode's Metal Toolchain, a separate download. Per project: delete this
      # step when the project has no .metal files.
      - name: Install the Metal Toolchain
        run: |
          xcodebuild -version
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # The IPA is named <project>-<version>-ios.ipa, the version being the tag without its v.
      # Per project: the project's name.
      - name: Build the IPA
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/sideload/build-ipa.sh "$RUNNER_TEMP/derived" "dist/rootshell-${TAG#v}-ios.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: dist/
          if-no-files-found: error

  # Creates the release from the IPA build made, and runs none of the project's code.
  github-release:
    needs: [kind, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.kind.outputs.prerelease }}
        run: gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --prerelease="$PRERELEASE"
